# Deep research from Jan - settings of the research runner (tools/research-runner.py) and the proxy gate.
# Read every few seconds: a change applies without restarting anything.

# Hold the research (between model calls) while another client - Jan, the chat page, OpenCode, Codex, dsh - used
# Strata in the last N minutes, so your own chats are not stuck behind a long research call. 0 = never yield.
yield_minutes = 5

# Research pauses between model calls in this window and continues after it (the research clock stops; a job that
# is queued waits). "off" = no night pause.
night_pause = off   # 2026-10-18 00:0x: the user allowed research jobs at any time ("I just wanna test it out"); 23:00-09:00 brings the pause back

# Research time per question when none is given (the report stage comes after it), and the most a job may ask for.
default_budget_minutes = 180
max_budget_minutes = 600

# Stop LDR, strata-proxy and LDR's SearXNG (8889) when no research job has run for this long.
ldr_idle_stop_minutes = 15

# Claims the citation check verifies per report (0 = all; a full check of a long report takes hours). Applies the
# next time LDR starts (it stops itself after ldr_idle_stop_minutes without jobs).
verify_max_claims = 120

# research_quick (Jan) waits this long for the answer before it returns the job id instead. Keep it under Jan's MCP
# tool-call timeout (Settings > MCP Servers: toolCallTimeoutSeconds, now 30); quick answers take about 1-3 minutes.
quick_wait_seconds = 25
